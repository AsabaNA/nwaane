<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex"><title>Owners' console</title><link rel=stylesheet href=owners.css><link rel=stylesheet href=/charts.css><script src=/charts.js></script></head><body>
<div id=app></div><dialog id=dg></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' '),A='/owners/api/';
async function api(u,b){const r=await fetch(A+u,b&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d={};try{d=await r.json()}catch{}return{ok:r.ok,s:r.status,d}}
const ER={noconsent:'The school has not allowed support access.',noprincipal:'This school has no active principal.',login:'Wrong email or password.',many:'Too many attempts. Wait 10 minutes.',code:'That code is wrong or already used.',reason:'Give a reason (at least 3 characters).',date:'Check the date.',invalid:'Check the values.',status:'This invoice is not in the right state.',modules:'Pick at least one module.',pct:'Percent must be 0 to 100.',role:'Your role cannot do that.',ref:'A mobile money or bank payment needs its reference.',auth:'Please sign in again.'};
const em=r=>ER[r.d.error]||'Something went wrong.';
const ST={free:['Free term','info'],paying:['Paying','ok'],overdue:['Overdue','warn'],readonly:['Read-only','bad'],cancelled:['Cancelled','']};
const chip=s=>`<span class="chip ${ST[s][1]}">${ST[s][0]}</span>`,IS={draft:['Draft','info'],sent:['Sent','warn'],paid:['Paid','ok'],void:['Cancelled','']};
const ichip=i=>`<span class="chip ${IS[i.status][1]}">${IS[i.status][0]}</span>`;
const MN={reports:'Reports',fees:'Fees',tracking:'Tracking'},mods=m=>m.length==3?'Complete':m.map(x=>MN[x]).join(' + ');
let ME=0,TAB='money',S={q:'',state:''};
// ---- dialog helper
function ask(title,fields,ok,label='Save'){const d=$('#dg');d.innerHTML=`<h2>${title}</h2><form method=dialog onsubmit="return false">${fields.map(f=>`<div class=f><label for=f_${f.k}>${f.l}</label>${f.t=='area'?`<textarea id=f_${f.k}>${esc(f.v||'')}</textarea>`:f.t=='select'?`<select id=f_${f.k}>${f.o.map(([v,l])=>`<option value="${v}" ${v==f.v?'selected':''}>${l}`).join('')}</select>`:f.t=='check'?f.o.map(([v,l])=>`<label style="text-transform:none;letter-spacing:0;font-size:14px"><input type=checkbox style="width:auto;min-height:0" name=${f.k} value=${v} ${(f.v||[]).includes(v)?'checked':''}> ${l}</label>`).join(''):`<input id=f_${f.k} type=${f.t||'text'} value="${esc(f.v??'')}" ${f.ph?`placeholder="${f.ph}"`:''}>`}</div>`).join('')}<p class=err id=dgerr></p><div class=fa><button type=button class=b onclick="$('#dg').close()">Cancel</button><button type=submit class="b p" id=dgok>${label}</button></div></form>`;
 d.querySelector('form').onsubmit=async e=>{e.preventDefault();const v={};fields.forEach(f=>{v[f.k]=f.t=='check'?[...d.querySelectorAll(`[name=${f.k}]:checked`)].map(x=>x.value):d.querySelector('#f_'+f.k).value});$('#dgok').disabled=true;const r=await ok(v);if(r&&!r.ok){$('#dgerr').textContent=em(r);$('#dgok').disabled=false}else d.close()};d.showModal()}
// ---- login
function login(m=''){$('#app').innerHTML=`<div class=login><div class=logo style="color:var(--ink)"><i></i>Owners' console</div><div class=card><h1>Sign in</h1><p class=sub>Use the owner email and password from the local .env file.</p><form onsubmit="return lg(event)"><div class=f><label for=em>Email</label><input id=em type=email autocomplete=username required></div><div class=f style="margin-top:12px"><label for=pw>Password</label><input id=pw type=password autocomplete=current-password required></div><p class=err id=le>${m}</p><button class="b p" style="width:100%;margin-top:14px;justify-content:center">Continue</button></form></div></div>`}
let TK='';
async function lg(e){e.preventDefault();const r=await api('login',{email:$('#em').value,password:$('#pw').value});if(!r.ok)return $('#le').textContent=em(r),false;TK=r.d.ticket;codeStep(r.d.hint,r.d.sent);return false}
function codeStep(h,sent){$('#app').innerHTML=`<div class=login><div class=logo style="color:var(--ink)"><i></i>Owners' console</div><div class=card><h1>Enter the code</h1><p class=sub>${sent?'We emailed a 6-digit code to':'We could not send the email to'} <b>${h}</b>. ${sent?'It works for 10 minutes.':'Press Send again.'}</p><form onsubmit="return cv(event)"><div class=f><label for=cd>Code</label><input id=cd inputmode=numeric autocomplete=one-time-code maxlength=6 required></div><p class=err id=le></p><button class="b p" style="width:100%;margin-top:14px;justify-content:center">Sign in</button></form><p class=sub style="margin-top:12px"><a href=# onclick="return rs()">Send again</a> · <a href=# onclick="login();return false">Back</a></p></div></div>`;$('#cd').focus()}
async function cv(e){e.preventDefault();const r=await api('login/verify',{ticket:TK,code:$('#cd').value});if(!r.ok)return $('#le').textContent=r.d.error=='code'?'That code is wrong or expired.':r.d.error=='expired'?'This sign-in expired. Start again.':em(r),false;boot();return false}
async function rs(){const r=await fetch('/api/auth/resend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket:TK})});$('#le').textContent=r.ok?'A new code is on its way.':r.status==429?'Wait 30 seconds before asking again.':'Could not send. Start again.';return false}
// ---- shell
const TABS=[['money','Money',['owner','finance']],['schools','Schools',['owner','finance','support']],['invoices','Invoices',['owner','finance']],['reminders','Reminders',['owner','finance']],['prices','Prices',['owner','finance']],['usage','Usage',['owner','finance','support']],['health','Health',['owner','support']],['ai','AI assistant',['owner']],['news','Announcements',['owner']],['audit','Activity log',['owner']]];
async function boot(){const r=await api('me');if(!r.ok)return login();ME=r.d;if(!TABS.find(t=>t[0]==TAB&&t[2].includes(ME.role)))TAB=ME.role=='support'?'schools':'money';draw()}
function draw(){$('#app').innerHTML=`<header class=top><div class=logo><i></i>Owners<small>console</small></div><nav class=tabs>${TABS.filter(t=>t[2].includes(ME.role)).map(t=>`<button class="${t[0]==TAB?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><div class=who><span>${esc(ME.name)} · ${ME.role}</span><button onclick="out()">Sign out</button></div></header><main id=m></main>`;({money:vMoney,schools:vSchools,invoices:vInv,reminders:vRem,prices:vPrices,usage:vUsage,health:vHealth,ai:vAI,news:vNews,audit:vAudit})[TAB]()}
function go(t){TAB=t;draw()}
async function out(){await api('logout',{});login()}
// ---- money
let MT=null;
async function vMoney(){const r=await api('home'+(MT?`?year=${MT[0]}&term=${MT[1]}`:''));if(!r.ok)return $('#m').innerHTML=`<p class=err>${em(r)}</p>`;const d=r.d,c=d.counts;
 const stat=(l,v,s,k)=>`<div class="stat ${k||''}"><p>${l}</p><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
 const rem=(await api('reminders')).d||[],rm=Object.fromEntries(rem.map(x=>[x.number,x]));
 $('#m').innerHTML=`<h1>Money</h1><p class=sub>Counts and money only. School content is never shown here.</p>
 <div class=tb><label style="margin:0">Term</label><select onchange="MT=this.value.split('-').map(Number);vMoney()">${d.terms.map(t=>`<option value="${t.year}-${t.term}" ${t.year==d.term.year&&t.term==d.term.term?'selected':''}>Term ${t.term} · ${t.year}/${t.year+1}`).join('')}</select>${d.drafts?`<button class="b p" onclick="go('invoices')">${d.drafts} draft invoice${d.drafts>1?'s':''} to review</button>`:''}</div>
 <div class="grid g5">${stat('Schools',c.schools,c.cancelled?c.cancelled+' cancelled':'')}${stat('Free term',c.free)}${stat('Paying',c.paying,'','s-ok')}${stat('Overdue',c.overdue,'',c.overdue?'s-warn':'')}${stat('Read-only',c.readonly,'',c.readonly?'s-bad':'')}</div>
 <div class="grid g4">${stat('Estimated billing',fm(d.estimated)+' <small>FCFA</small>','paid schools, running term')}${stat('Invoiced',fm(d.invoiced)+' <small>FCFA</small>','Term '+d.term.term)}${stat('Collected',fm(d.collected)+' <small>FCFA</small>','','s-ok')}${stat('Outstanding',fm(d.outstanding)+' <small>FCFA</small>','',d.outstanding?'s-warn':'')}</div>
 ${ownCharts(d)}
 <div class=card><h2>Needs action <span class="chip">${d.actions.length}</span></h2>${d.actions.length?d.actions.map(a=>`<div class=act><i class="${a.kind=='free_end'?'info':a.kind=='overdue'?'warn':'bad'}"></i><span><b>${esc(a.school)}</b>${a.kind=='free_end'?`: free term ends in ${a.left} day${a.left==1?'':'s'}, ${a.students} students entered`:a.manual?': switched to read-only by an owner':`: ${a.kind=='readonly'?'read-only, ':''}${a.days} day${a.days==1?'':'s'} overdue (${fm(a.amount)} FCFA)`}<small>${a.invoice?esc(a.invoice):''}</small></span>${rm[a.invoice]?`<a class="b sm p" href="${esc(rm[a.invoice].url)}" target=_blank rel=noopener onclick="sent(${rm[a.invoice].invoice_id},'${rm[a.invoice].kind}')">Remind on WhatsApp</a>`:''}<button class="b sm" onclick="prof(${a.school_id})">Open school</button></div>`).join(''):'<p class=muted>Nothing needs you right now.</p>'}</div>
 <div class=card><h2>Schools</h2><div class=scroll><table><tr><th>School<th>Modules<th class=num>Students<th class="num hm">Teachers<th class=num>Estimate now<th class=hm>Last invoice<th>Status<th class=hm>Due<th class=hm>Last payment</tr>${d.schools.map(s=>`<tr class=clk onclick="prof(${s.id})"><td><b>${esc(s.name)}</b><br><small class=muted>${esc(s.code)}${s.city?' · '+esc(s.city):''}</small><td>${mods(s.modules)}<td class=num>${s.students}<td class="num hm">${s.teachers}<td class=num>${fm(s.estimate)}<td class=hm>${s.last_invoice?`${esc(s.last_invoice.number)}<br><small class=muted>${fm(s.last_invoice.amount)} · ${s.last_invoice.status}</small>`:'—'}<td>${chip(s.state)}<td class=hm>${s.due||(s.state=='free'?'ends '+s.free_until:'—')}<td class=hm>${s.last_payment?`${fm(s.last_payment.amount)}<br><small class=muted>${s.last_payment.date}</small>`:'—'}`).join('')||'<tr><td colspan=9 class=muted>No schools yet.'}</table></div></div>
 <div class=card><h2>Export for the accountant</h2>${expForm(d.term)}</div>`}
function ownCharts(d){const c=d.counts,sc=d.schools.filter(x=>x.state!='cancelled'),cards=[],fmt=n=>fm(n);
 cards.push(chCard({id:'ch_o1',cls:'card',title:'Schools by status',sub:c.schools+(c.schools==1?' school':' schools'),body:chDonut([{l:'Free term',v:c.free,color:CH.gray},{l:'Paying',v:c.paying,color:CH.c1},{l:'Overdue',v:c.overdue,color:CH.c2},{l:'Read-only',v:c.readonly,color:CH.red}],{center:{big:String(c.schools),small:'schools'},label:'Schools by status'}),table:{head:['Status','Schools'],rows:[['Free term',c.free],['Paying',c.paying],['Overdue',c.overdue],['Read-only',c.readonly]]}}));
 if(d.invoiced||d.collected||d.outstanding)cards.push(chCard({id:'ch_o2',cls:'card',title:'Billing, term '+d.term.term,sub:d.term.year+'/'+(d.term.year+1)+' · FCFA',body:chBar([{l:'Invoiced',v:d.invoiced,color:CH.gray},{l:'Collected',v:d.collected,color:CH.c1},{l:'Outstanding',v:d.outstanding,red:true}],{fmt,label:'Billing'}),table:{head:['','FCFA'],rows:[['Invoiced',fmt(d.invoiced)],['Collected',fmt(d.collected)],['Outstanding',fmt(d.outstanding)]]}}));
 const ms=[],now=new Date();for(let i=5;i>=0;i--){const x=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i,1));ms.push(x.toISOString().slice(0,7))}
 const cnt=ms.map(m=>d.schools.filter(s=>(s.created||'').startsWith(m)).length);
 cards.push(chCard({id:'ch_o3',cls:'card',title:'New schools per month',sub:'Sign-ups, last 6 months',body:chBar(ms.map((m,i)=>({l:m.slice(5)+'/'+m.slice(2,4),v:cnt[i]})),{col:1,label:'New schools'}),table:{head:['Month','New schools'],rows:ms.map((m,i)=>[m,cnt[i]])}}));
 const top=[...sc].sort((a,b)=>b.estimate-a.estimate).slice(0,8).filter(x=>x.estimate>0);
 if(top.length)cards.push(chCard({id:'ch_o4',cls:'card',title:'Estimated billing by school',sub:'Running term, FCFA, top '+top.length,body:chBar(top.map(x=>({l:x.name,v:x.estimate})),{fmt,lw:140,label:'Estimated billing'}),table:{head:['School','FCFA'],rows:top.map(x=>[x.name,fmt(x.estimate)])}}));
 return`<div class=ch-grid>${cards.join('')}</div>`}
const expForm=t=>`<div class=fg><div><label>Year</label><select id=ey>${[0,1,2].map(i=>`<option value=${t.year-i}>${t.year-i}/${t.year-i+1}`).join('')}</select></div><div><label>Term</label><select id=et><option value=0>Whole year<option value=1>Term 1<option value=2>Term 2<option value=3>Term 3</select></div><div class=acts><button class=b onclick="ex('csv')">Invoices CSV</button><button class=b onclick="ex('csv','payments')">Payments CSV</button><button class=b onclick="ex('pdf')">PDF summary</button></div></div>`;
function ex(f,scope){location=`${A}export.${f}?year=${$('#ey').value}&term=${$('#et').value}${scope?'&scope='+scope:''}`}
async function sent(id,kind){await api('reminders/sent',{invoice_id:id,kind})}
// ---- schools
async function vSchools(){const r=await api(`schools?q=${encodeURIComponent(S.q)}&state=${S.state}`);if(!r.ok)return;const m=ME.role!='support';
 $('#m').innerHTML=`<h1>Schools</h1><p class=sub>Registry of every school. Counts only, never names of students or any school content.</p><div class=tb><input placeholder="Search name, code, city or principal" value="${esc(S.q)}" oninput="S.q=this.value;dbs()"><select onchange="S.state=this.value;vSchools()"><option value="">All statuses${Object.entries(ST).map(([k,v])=>`<option value=${k} ${S.state==k?'selected':''}>${v[0]}`).join('')}</select></div>
 <div class=card><div class=scroll><table><tr><th>School<th>Principal<th class=hm>Modules<th class=num>Students<th class=num>Teachers<th>Status<th class=hm>Signed up<th class=hm>Free term ends${m?'<th class="num hm">Estimate':''}</tr>${r.d.map(s=>`<tr class=clk onclick="prof(${s.id})"><td><b>${esc(s.name)}</b><br><small class=muted>${esc(s.code)}${s.city?' · '+esc(s.city):''}</small><td>${esc(s.principal)}<br><small class=muted>${esc(s.phone)}</small><td class=hm>${mods(s.modules)}<td class=num>${s.students}<td class=num>${s.teachers}<td>${chip(s.state)}<td class=hm>${s.created}<td class=hm>${s.free_until||'—'}${m?`<td class="num hm">${fm(s.estimate)}`:''}`).join('')||'<tr><td colspan=9 class=muted>No schools match.'}</table></div></div>`}
let T;const dbs=()=>{clearTimeout(T);T=setTimeout(async()=>{const f=document.activeElement;await vSchools();const i=$('.tb input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
async function prof(id){TAB='schools';draw();const r=await api('schools/'+id);if(!r.ok)return;setTimeout(()=>loadSup(id),0);const{school:s,audit,invoices}=r.d,m=ME.role!='support',canAct=['owner','support'].includes(ME.role),own=ME.role=='owner';
 $('#m').innerHTML=`<p><button class="b sm" onclick="vSchools()">← All schools</button></p><div style="display:flex;gap:12px;align-items:center;margin:12px 0 4px;flex-wrap:wrap"><h1>${esc(s.name)}</h1>${chip(s.state)}</div><p class=sub>${esc(s.code)}${s.city?' · '+esc(s.city):''}</p>
 <div class=two><div class=card><h2>Profile</h2><dl class=kv><dt>Principal<dd>${esc(s.principal)||'—'}<dt>Phone<dd>${esc(s.phone)||'—'}<dt>Signed up<dd>${s.created}<dt>Modules<dd>${mods(s.modules)}<dt>Free term ends<dd>${s.free_until||'—'}<dt>Peak this term<dd>${s.students} students · ${s.teachers} teachers${m?`<dt>Estimate now<dd>${fm(s.estimate)} FCFA<dt>Discount<dd>${s.discount_pct}%<dt>Price lock<dd>${s.lock_until||'none'}`:''}</dl></div>
 <div class=card><h2>Private notes</h2><textarea id=nt>${esc(s.note)}</textarea><div class=acts style="margin-top:10px"><button class=b onclick="note(${s.id})">Save note</button></div><p id=ns class=ok-t></p></div></div>
 ${canAct?`<div class=card><h2>Actions <small class=muted style="font-weight:400">each asks for a reason and is logged</small></h2><div class=acts><button class=b onclick="act(${s.id},'extend','${s.free_until}')">Extend free term</button><button class=b onclick="act(${s.id},'modules','${s.modules}')">Change modules</button>${s.flag?`<button class="b p" onclick="act(${s.id},'reactivate')">Reactivate</button>`:`<button class="b d" onclick="act(${s.id},'readonly')">Switch to read-only</button>`}${s.flag!='cancelled'?`<button class="b d" onclick="act(${s.id},'cancel')">Cancel school</button>`:''}${own?`<button class=b onclick="act(${s.id},'discount',${s.discount_pct})">Set discount</button><button class=b onclick="act(${s.id},'lock')">Lock prices</button>${s.lock_until?`<button class=b onclick="act(${s.id},'unlock')">Remove lock</button>`:''}`:''}</div></div>`:''}
 ${canAct?`<div class=card id=spx><h2>Support</h2><p class=muted>Loading…</p></div>`:''}
 ${m?`<div class=card><h2>Invoices</h2>${(invoices||[]).length?`<div class=scroll><table><tr><th>Number<th>Term<th class=num>Amount<th class=num>Paid<th>Status<th>Due</tr>${invoices.map(i=>`<tr><td>${esc(i.number)}<td>${i.term?'T'+i.term+' '+i.year+'/'+(i.year+1):'Reg. fee'}<td class=num>${fm(i.amount)}<td class=num>${fm(i.paid)}<td>${ichip(i)}<td>${i.due||'—'}`).join('')}</table></div>`:'<p class=muted>No invoices yet.</p>'}</div>`:''}
 <div class=card><h2>Owner activity on this school</h2>${audit.length?`<table>${audit.map(a=>`<tr><td class=mono>${a.at.slice(0,16).replace('T',' ')}<td>${esc(a.owner_name)}<td><b>${esc(a.action)}</b><td>${esc(a.detail)}`).join('')}</table>`:'<p class=muted>Nothing yet.</p>'}</div>`}
async function loadSup(id){const r=await api(`schools/${id}/support`);if(!r.ok)return;const d=r.d,x=$('#spx');if(!x)return;
 x.innerHTML=`<h2>Support <span class="chip ${d.on?'ok':''}">${d.on?'Access allowed until '+d.until.slice(0,16).replace('T',' '):'School has not allowed access'}</span></h2><p class=muted>Support mode is read-only and only works while the school's principal has switched on "Support access" in their Settings. The school sees a log of every session.</p><div class=acts style="margin:12px 0"><button class="b p" ${d.on?'':'disabled'} onclick="supOpen(${id})">Open in support mode</button><button class=b onclick="rstLink(${id})">Send password reset link</button><a class=b href="${A}schools/${id}/export" download>Download school data (JSON)</a></div>
 ${d.sessions.length?`<table>${d.sessions.map(s=>`<tr><td class=mono>${s.started.slice(0,16).replace('T',' ')}<td>${esc(s.owner_name)}<td>${s.reads} pages<td>${esc((s.areas||'').split(',').join(', '))}<td>${s.ended?'ended':'open'}`).join('')}</table>`:''}`}
const supOpen=id=>ask('Open in support mode',[{k:'reason',l:'Reason (logged)',t:'area'}],async f=>{const r=await api(`schools/${id}/support`,{reason:f.reason});if(r.ok){window.open(r.d.url,'_blank');loadSup(id)}return r},'Open');
const rstLink=id=>ask('Send password reset link',[{k:'reason',l:'Reason (logged)',t:'area'}],async f=>{const r=await api(`schools/${id}/reset-link`,{reason:f.reason});if(r.ok){const d=r.d;$('#dg').close();setTimeout(()=>{const g=$('#dg');g.innerHTML=`<h2>Reset link for ${esc(d.principal)}</h2><p class=muted>Works once and expires in 24 hours. You never see or set the password.</p><div class=msg style="word-break:break-all">${esc(d.url)}</div><div class=acts style="margin-top:12px"><a class="b p" target=_blank rel=noopener href="${esc(d.wa)}">Send on WhatsApp</a><button class=b onclick="navigator.clipboard.writeText('${d.url}')">Copy link</button><button class=b onclick="$('#dg').close()">Done</button></div>`;g.showModal()},50)}return r},'Create link');
async function note(id){const r=await api(`schools/${id}/note`,{note:$('#nt').value});$('#ns').textContent=r.ok?'Saved.':em(r)}
const RS={t:'area',k:'reason',l:'Reason (logged)'};
function act(id,a,v){const run=(extra)=>async f=>{const r=await api(`schools/${id}/action`,{action:a,...f,...(extra||{})});if(r.ok)prof(id);return r};
 if(a=='extend')return ask('Extend the free term',[{k:'until',l:'New end date',t:'date',v},RS],run());
 if(a=='modules')return ask('Change modules',[{k:'modules',l:'Modules',t:'check',o:Object.entries(MN),v:v.split(',')},RS],run());
 if(a=='discount')return ask('Set discount',[{k:'pct',l:'Discount %',t:'number',v},RS],run());
 if(a=='lock')return ask('Lock prices (founding school)',[{k:'until',l:'Frozen until',t:'date'},RS],run(),'Lock');
 const T={readonly:['Switch to read-only','The school can view and print but not enter data.'],cancel:['Cancel school','Sign-in is blocked. Data is kept for the 90-day exit period.'],reactivate:['Reactivate','The school returns to normal.'],unlock:['Remove price lock','The school moves to the current price list.']}[a];
 ask(T[0]+`<br><small style="font:400 13px var(--body);color:var(--soft)">${T[1]}</small>`,[RS],run(),T[0])}
// ---- invoices
let IV={st:''};
async function vInv(){const r=await api('invoices?status='+IV.st);if(!r.ok)return;const L=r.d;
 $('#m').innerHTML=`<h1>Invoices</h1><p class=sub>Drafts are made automatically when a term ends. Review, adjust, then send.</p><div class=tb><select onchange="IV.st=this.value;vInv()"><option value="">All${['draft','sent','paid','void'].map(s=>`<option value=${s} ${IV.st==s?'selected':''}>${IS[s][0]}`).join('')}</select></div>
 <div class=card><div class=scroll><table><tr><th>Number<th>School<th class=hm>Term<th class=num>Amount<th class=num>Owing<th>Status<th class=hm>Due<th></tr>${L.map(i=>`<tr class=clk onclick="ix(${i.id})"><td><b>${esc(i.number)}</b><td>${esc(i.school)}<td class=hm>${i.term?'T'+i.term+' '+i.year+'/'+(i.year+1):'Reg. fee'}<td class=num>${fm(i.amount)}<td class=num>${i.owing?fm(i.owing):'—'}<td>${ichip(i)}<td class=hm>${i.due||'—'}<td>›</tr><tr id=x${i.id} hidden class=inv-x><td colspan=8></td></tr>`).join('')||'<tr><td colspan=8 class=muted>No invoices.'}</table></div></div><div class=card><h2>Export</h2>${expForm(termNow())}</div>`;window.IL=Object.fromEntries(L.map(i=>[i.id,i]))}
const termNow=()=>{const d=new Date(),y=d.getUTCMonth()>=7?d.getUTCFullYear():d.getUTCFullYear()-1;return{year:y,term:1}};
function ix(id){const i=IL[id],x=$('#x'+id);if(!x.hidden){x.hidden=true;return}document.querySelectorAll('.inv-x').forEach(e=>e.hidden=true);x.hidden=false;
 x.firstElementChild.innerHTML=`<div class=two><div><h3 style="margin-bottom:8px">${esc(i.number)} · ${i.students} students · ${i.teachers} teachers · ${mods(i.modules)}</h3><table>${i.lines.map(l=>`<tr><td>${{reports:'Report cards',fees:'Fees',tracking:'Teacher tracking',min:'Minimum per term'}[l.k]}<td class=num>${l.k=='min'?'':l.qty+' × '+fm(l.unit)}<td class=num>${fm(l.amount)}`).join('')}${i.discount?`<tr><td>Discount${i.adj_note?` <small class=muted>(${esc(i.adj_note)})</small>`:''}<td><td class=num>− ${fm(i.discount)}`:''}<tr><td><b>Total</b><td><td class=num><b>${fm(i.amount)}</b></table></div>
 <div>${i.payments.length?`<h3 style="margin-bottom:8px">Payments</h3><table>${i.payments.map(p=>`<tr><td><a href="${A}payments/${p.id}/receipt">${p.receipt}</a><td>${p.date}<td>${esc(p.method)}${p.ref?' · '+esc(p.ref):''}<td class=num>${fm(p.amount)}`).join('')}</table>`:''}${i.credits.length?`<h3 style="margin:10px 0 8px">Credit notes</h3><table>${i.credits.map(c=>`<tr><td>${c.number}<td>${esc(c.reason)}<td class=num>− ${fm(c.amount)}`).join('')}</table>`:''}
 <div class=acts style="margin-top:12px">${i.status=='draft'?`<button class=b onclick="adj(${i.id})">Adjust</button><button class="b p" onclick="snd(${i.id})">Send invoice</button>`:`<a class=b href="${A}invoices/${i.id}/pdf">Invoice PDF</a>`}${i.status=='sent'?`<button class="b p" onclick="pay(${i.id})">Record payment</button><button class=b onclick="cn(${i.id})">Credit note</button>`:''}</div></div></div>`}
const after=r=>{if(r.ok)vInv();return r};
const adj=id=>ask('Adjust draft invoice',[{k:'discount',l:`Discount in FCFA (gross ${fm(IL[id].gross)})`,t:'number',v:IL[id].discount},{k:'note',l:'Why',t:'area'}],f=>api(`invoices/${id}/adjust`,{discount:+f.discount,note:f.note}).then(after));
const snd=id=>ask('Send this invoice?',[],()=>api(`invoices/${id}/send`,{}).then(after),'Send');
const pay=id=>ask('Record a payment',[{k:'amount',l:`Amount in FCFA (owing ${fm(IL[id].owing)})`,t:'number',v:IL[id].owing},{k:'date',l:'Date received',t:'date',v:new Date().toISOString().slice(0,10)},{k:'method',l:'Method',t:'select',o:[['momo','MTN MoMo'],['om','Orange Money'],['bank','Bank transfer'],['cash','Cash'],['other','Other']]},{k:'ref',l:'Transaction number (MoMo / bank)'}],f=>api(`invoices/${id}/payment`,{amount:+f.amount,date:f.date,method:f.method,ref:f.ref}).then(after),'Record');
const cn=id=>ask('Credit note',[{k:'amount',l:`Amount in FCFA (max ${fm(IL[id].owing)})`,t:'number'},{k:'reason',l:'Reason',t:'area'}],f=>api(`invoices/${id}/credit`,{amount:+f.amount,reason:f.reason}).then(after),'Issue');
// ---- reminders
let RL='en';
async function vRem(){const r=await api('reminders?lang='+RL);if(!r.ok)return;const KL={before:'Due soon',due:'Due',after7:'7 days late',after14:'14 days late'};
 $('#m').innerHTML=`<h1>Reminders</h1><p class=sub>Prepared WhatsApp messages. Tap to open WhatsApp with the text filled in, then press send yourself.</p><div class=tb><select onchange="RL=this.value;vRem()"><option value=en ${RL=='en'?'selected':''}>English<option value=fr ${RL=='fr'?'selected':''}>Français</select></div>
 ${r.d.map(x=>`<div class=card><h2>${esc(x.school)} <span class="chip warn">${KL[x.kind]}</span><span class=muted style="font:400 13px var(--body)">${esc(x.number)} · ${fm(x.owing)} FCFA · ${x.days<0?(-x.days)+' days to go':x.days+' days after due'}</span></h2><p class=muted>To ${esc(x.principal)||'the principal'} ${esc(x.phone)||'(no phone number on file: WhatsApp will ask you to pick a contact)'}</p><div class=msg>${esc(x.text)}</div><div class=acts><a class="b p" target=_blank rel=noopener href="${esc(x.url)}" onclick="sent(${x.invoice_id},'${x.kind}');setTimeout(vRem,800)">Open in WhatsApp</a>${x.last?`<span class=muted style="align-self:center">Last sent ${x.last.slice(0,10)}</span>`:''}</div></div>`).join('')||'<div class=card><p class=muted>No reminders due. Reminders appear 7 days before an invoice is due.</p></div>'}`}
// ---- prices
async function vPrices(){const r=await api('prices');if(!r.ok)return;const d=r.d,L={reports_solo:'Report cards, alone (per student)',reports_pair:'Report cards, in a two-module package (per student)',reports_bundle:'Report cards, in Complete',fees_solo:'Fees, alone (per student)',fees_pair:'Fees, in a two-module package (per student)',fees_bundle:'Fees, in Complete',tracking_solo:'Teacher tracking, alone (per teacher)',tracking_pair:'Teacher tracking, in a two-module package (per teacher)',tracking_bundle:'Teacher tracking, in Complete',commit_fee:'Commitment fee for schools joining after Term 1 (FCFA)',min_term:'Minimum per term (FCFA)',grace_days:'Grace days after due date',due_days:'Days to pay an invoice'};
 $('#m').innerHTML=`<h1>Prices</h1><p class=sub>Changes apply from the next term (${d.next_start}). Schools with a price lock keep their frozen list.</p><div class=card><h2>Price list ${d.can_edit?'':'<span class=chip>view only</span>'}</h2><div class=fg>${Object.keys(L).map(k=>`<div><label for=p_${k}>${L[k]}</label><input id=p_${k} type=number min=0 value=${d.current[k]} ${d.can_edit?'':'disabled'}></div>`).join('')}</div>${d.can_edit?`<div class=acts style="margin-top:14px"><button class="b p" onclick="spr(${JSON.stringify(Object.keys(L)).replace(/"/g,"'")})">Schedule changes from ${d.next_start}</button></div><p id=pe class=err></p>`:''}</div>
 <div class=card><h2>Scheduled changes</h2>${d.scheduled.length?`<table>${d.scheduled.map(s=>`<tr><td>${s.eff}<td>${L[s.key]||s.key}<td class=num>${fm(s.value)}`).join('')}</table>${d.can_edit?[...new Set(d.scheduled.map(s=>s.eff))].map(e=>`<button class="b sm d" style="margin-top:10px" onclick="api('prices/cancel',{eff:'${e}'}).then(vPrices)">Cancel changes from ${e}</button>`).join(' '):''}`:'<p class=muted>None.</p>'}</div>`;window.PC=d.current}
async function spr(keys){const ch={};for(const k of keys){const v=+$('#p_'+k).value;if(v!=PC[k])ch[k]=v}if(!Object.keys(ch).length)return $('#pe').textContent='Nothing changed.';const r=await api('prices',{changes:ch});r.ok?vPrices():$('#pe').textContent=em(r)}
// ---- AI assistant: global kill switch, settings, usage
async function vAI(){const r=await api('ai');if(!r.ok)return;const d=r.d,on=d.enabled,ready=on&&d.key_set,usd=x=>'$'+(x||0).toFixed(2);
 $('#m').innerHTML=`<h1>AI assistant</h1><p class=sub>Answers questions from a school's own data. Read-only, and each person only sees what their role allows.</p>
 <div class=card style="border-width:2px;border-color:${ready?'var(--ok)':on?'var(--warn)':'var(--line)'}"><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h2 style="margin:0 0 4px">Master switch <span class="chip ${ready?'ok':on?'warn':''}">${ready?'ON for all schools':on?'ON, but no key':'OFF for all schools'}</span></h2><p class=muted style="margin:0">${on?'Turn it off to stop the assistant everywhere at once. It disappears from every school immediately.':'While off, no school sees the assistant and nothing is sent to Google.'} Schools still decide for themselves whether to use it once it is on.</p></div>
 <button class="b ${on?'d':'p'}" style="min-height:56px;font-size:17px;padding:0 28px" onclick="aiSw(${on?0:1})">${on?'Switch OFF for all schools':'Switch ON'}</button></div>
 ${d.key_set?'':'<p class=err style="margin:12px 0 0">No Gemini key found. Add GEMINI_API_KEY as a secret (Cloudflare: <code>wrangler secret put GEMINI_API_KEY</code>; own server: .env) and restart. The key is never stored in the database.</p>'}</div>
 <div class="grid g4"><div class=stat><p>Questions today</p><b>${d.today.n}</b><small>${usd(d.today.usd)} est.</small></div><div class=stat><p>Questions this month</p><b>${d.month.n}</b><small>${usd(d.month.usd)} est.</small></div><div class="stat ${d.errors_today?'s-warn':''}"><p>Failed today</p><b>${d.errors_today}</b></div><div class=stat><p>Schools using it</p><b>${d.schools.filter(s=>s.ai_on).length}</b><small>of ${d.schools.length}</small></div></div>
 <div class=card><h2>Connection and limits</h2><div class=fg><div><label>Model</label><input id=ai_m value="${esc(d.model)}"></div><div><label>Questions per user per day</label><input id=ai_u type=number min=1 value=${d.user_daily}></div><div><label>Per school per day</label><input id=ai_s type=number min=1 value=${d.school_daily}></div><div><label>All schools per day</label><input id=ai_g type=number min=1 value=${d.global_daily}></div><div><label>Price per 1M input tokens (USD)</label><input id=ai_pi type=number step=0.01 value=${d.price_in}></div><div><label>Price per 1M output tokens (USD)</label><input id=ai_po type=number step=0.01 value=${d.price_out}></div></div>
 <p class=muted>The model is a setting: if Google retires or restricts one, enter another name here, no update needed. Use a <b>paid</b> Gemini key: on the free tier Google may use the questions and school data to improve its products.</p>
 <div class=acts style="margin-top:10px"><button class="b p" onclick="aiSave()">Save</button><button class=b onclick="aiTest()">Test connection</button><span id=ai_r class=muted></span></div></div>
 <div class=card><h2>Schools</h2><table><tr><th>School<th>Opted in<th class=num>Today<th class=num>This month<th>${''}${d.schools.map(s=>`<tr><td>${esc(s.name)} <small class=muted>${esc(s.code)}</small><td>${s.ai_on?'<span class="chip ok">yes</span>':'<span class=chip>no</span>'}<td class=num>${s.today}<td class=num>${s.month}<td class=num><button class="b sm ${s.ai_block?'':'d'}" onclick="aiBlock(${s.id},${s.ai_block?0:1})">${s.ai_block?'Unblock':'Block this school'}</button>`).join('')}</table></div>`}
async function aiSw(on){const r=await api('ai/switch',{on});r.ok?vAI():alert('Could not change the switch.')}
async function aiSave(){const r=await api('ai/settings',{model:$('#ai_m').value.trim(),user_daily:+$('#ai_u').value,school_daily:+$('#ai_s').value,global_daily:+$('#ai_g').value,price_in:+$('#ai_pi').value,price_out:+$('#ai_po').value});$('#ai_r').textContent=r.ok?'Saved.':'Check the values (model name, whole numbers).'}
async function aiTest(){$('#ai_r').textContent='Testing…';const r=await api('ai/test',{});const d=r.d||{};$('#ai_r').innerHTML=d.ok?`<span style="color:var(--ok)">Working: ${esc(d.model)} answered in ${d.ms} ms.</span>`:`<span style="color:var(--bad)">Failed${d.http?' ('+d.http+')':''}: ${esc(d.error||'')}</span>`}
async function aiBlock(id,b){await api('ai/school',{school_id:id,block:b});vAI()}
// ---- usage and health (counts only)
const ago=iso=>{if(!iso)return 'never';const d=(Date.now()-Date.parse(iso))/864e5;return d<1?'today':d<2?'yesterday':Math.floor(d)+' days ago'};
async function vUsage(){const r=await api('usage');if(!r.ok)return;const{schools,atrisk}=r.d;
 $('#m').innerHTML=`<h1>Usage</h1><p class=sub>Counts only. Who is using the platform, never what they entered.</p>
 <div class=card><h2>At risk <span class=chip>${atrisk.length}</span></h2>${atrisk.length?atrisk.map(a=>`<div class=act><i class="${a.risk=='no_students'?'bad':'warn'}"></i><span><b>${esc(a.name)}</b>: ${a.risk=='no_students'?`signed up ${a.age} days ago, no students registered`:`free term ends in ${a.free_left} days, ${a.students} students and ${a.marks} marks entered`}<small>Last sign-in ${ago(a.last_login)}</small></span><button class="b sm" onclick="prof(${a.id})">Open school</button></div>`).join(''):'<p class=muted>No school looks at risk.</p>'}</div>
 <div class=card><h2>Schools</h2><div class=scroll><table><tr><th>School<th>Last sign-in<th class=num>Active users (7 d)<th class=num>Students<th class=num>Marks this term<th class=num>Report cards published<th>Flag</tr>${schools.map(u=>`<tr class=clk onclick="prof(${u.id})"><td><b>${esc(u.name)}</b><br><small class=muted>${esc(u.code)}</small><td>${ago(u.last_login)}<td class=num>${u.active7}<td class=num>${u.students}<td class=num>${fm(u.marks)}<td class=num>${u.published}<td>${u.risk?`<span class="chip warn">${u.risk=='no_students'?'No students':'Low use'}</span>`:''}`).join('')}</table></div></div>`}
const mb=n=>(n/1048576).toFixed(n>1e7?0:1)+' MB';
async function vHealth(){const r=await api('health');if(!r.ok)return;const d=r.d,max=Math.max(1,...d.writes.map(w=>w.n)),own=ME.role=='owner';
 $('#m').innerHTML=`<h1>Health</h1><p class=sub>Platform numbers only. Errors are stored without any school or personal data.</p>
 <div class="grid g4"><div class=stat><p>Database size</p><b>${mb(d.db_bytes)}</b><small>Cloudflare D1 limit as far as I know: 500 MB per database on the free plan, 10 GB paid. Check before launch.</small></div>
 <div class="stat ${d.backup&&d.backup.ok&&!d.backup_due?'s-ok':'s-warn'}"><p>Last backup</p><b>${d.backup?ago(d.backup.at):'never'}</b><small>${d.backup?(d.backup.ok?mb(d.backup.bytes)+' · '+esc(d.backup.note):'FAILED: '+esc(d.backup.note)):'No backup yet'}</small></div>
 <div class=stat><p>Writes today</p><b>${fm((d.writes.find(w=>w.day==new Date().toISOString().slice(0,10))||{n:0}).n)}</b><small>Saved changes, all schools. D1 free plan: about 100 000 row writes a day, as far as I know.</small></div>
 <div class="stat ${d.errors_7d?'s-warn':'s-ok'}"><p>Errors, 7 days</p><b>${d.errors_7d}</b></div></div>
 ${own?`<div class=acts style="margin-bottom:16px"><button class=b onclick="bk()">Back up now</button><span id=bks class=ok-t></span></div>`:''}
 <div class=card><h2>Writes per day</h2>${d.writes.length?`<div style="display:flex;gap:6px;align-items:flex-end;height:120px">${d.writes.map(w=>`<div title="${w.day}: ${w.n}" style="flex:1;background:var(--brand);border-radius:4px 4px 0 0;height:${Math.max(3,w.n/max*100)}%;min-width:8px"></div>`).join('')}</div><p class=muted style="margin-top:6px">${d.writes[0].day} to ${d.writes[d.writes.length-1].day}</p>`:'<p class=muted>No writes recorded yet.</p>'}</div>
 <div class=card><h2>Recent errors</h2>${d.errors.length?`<table>${d.errors.map(e=>`<tr><td class=mono>${e.at.slice(0,16).replace('T',' ')}<td>${esc(e.route)}<td>${esc(e.kind)}`).join('')}</table>`:'<p class=muted>No errors.</p>'}</div>`}
async function bk(){const r=await api('backup',{});$('#bks').textContent=r.d.ok?'Backup done.':'Backup failed.';setTimeout(vHealth,900)}
// ---- announcements
async function vNews(){const r=await api('announcements');if(!r.ok)return;const t=new Date().toISOString().slice(0,10),e=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
 $('#m').innerHTML=`<h1>Announcements</h1><p class=sub>A banner shown to every school until the end date. Schools can dismiss it for the session.</p>
 <div class=card><h2>New announcement</h2><div class=fg><div><label for=ae>Title (English)</label><input id=ae></div><div><label for=af>Title (French, optional)</label><input id=af></div><div><label for=be>Message (English)</label><input id=be></div><div><label for=bf>Message (French, optional)</label><input id=bf></div><div><label for=as>From</label><input id=as type=date value="${t}"></div><div><label for=ad>Until</label><input id=ad type=date value="${e}"></div><div><label for=al>Style</label><select id=al><option value=info>Information<option value=warn>Warning</select></div></div><p class=err id=ne></p><div class=acts style="margin-top:12px"><button class="b p" onclick="newAnn()">Publish</button></div></div>
 <div class=card><h2>History</h2>${r.d.length?`<table>${r.d.map(a=>`<tr><td><b>${esc(a.title_en)}</b><br><small class=muted>${esc(a.body_en||'')}</small><td>${a.starts} to ${a.ends}<td><span class="chip ${a.active&&a.ends>=t?'ok':''}">${a.active&&a.ends>=t?'Live':'Ended'}</span><td>${a.active&&a.ends>=t?`<button class="b sm d" onclick="api('announcements/${a.id}/end',{}).then(vNews)">End now</button>`:''}`).join('')}</table>`:'<p class=muted>None yet.</p>'}</div>`}
async function newAnn(){const r=await api('announcements',{title_en:$('#ae').value,title_fr:$('#af').value,body_en:$('#be').value,body_fr:$('#bf').value,starts:$('#as').value,ends:$('#ad').value,level:$('#al').value});r.ok?vNews():$('#ne').textContent=em(r)}
// ---- audit
async function vAudit(){const r=await api('audit');if(!r.ok)return;$('#m').innerHTML=`<h1>Activity log</h1><p class=sub>Every owner action. Entries cannot be edited or deleted, and each one is chained to the one before.</p><div class=tb><span class="chip ${r.d.valid?'ok':'bad'}">${r.d.valid?'Chain intact':'Chain broken: entries were tampered with'}</span></div><div class=card><div class=scroll><table><tr><th>When<th>Who<th>Action<th>School<th>Detail</tr>${r.d.rows.map(a=>`<tr><td class=mono>${a.at.slice(0,16).replace('T',' ')}<td>${esc(a.owner_name)||'system'}<td><b>${esc(a.action)}</b><td>${esc(a.school)}<td>${esc(a.detail)}`).join('')}</table></div></div>`}
boot();
</script></body></html>
