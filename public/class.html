.rl-row.ab{background:#fdeceb;border-color:#e8a7a3}.rl-row.ab i{color:#c62828}

let SUM='',RS=null;
async function rollOpen(){const r=await fetch(`/api/roll/sheet?class_id=${I.cid}&period=${I.period}&date=${I.rdate}`);let d={};try{d=await r.json()}catch{}if(!r.ok)return draw(t('err_d'));RS=d;rollDraw()}
const rlN=()=>RS.students.filter(s=>s.absent).length;
function rollDraw(m=''){$('#m').innerHTML=`<div class=ck-top><div class=ck-logo><i aria-hidden=true></i>${t('brand')}</div>${lang()}</div><main class=ck-card><div class=ck-head><span class=ck-eb>${esc(I.school)}</span><h1>${esc(I.cls)}</h1><p class=ck-lesson><b>${t('rl_h')}</b> · ${esc(RS.subject||'')} · ${t('period')} ${RS.period}</p></div>
 <div class=ck-body-in><p class=ck-p style="margin-bottom:14px">${RS.students.length?t('rl_p'):t('rl_no')}</p><div class=rl-top><b id=rn>${t('rl_n',{n:rlN()})}</b></div><div class=rl-list>${RS.students.map((s,i)=>`<button type=button class="rl-row ${s.absent?'ab':''}" onclick="rollTog(${i})" aria-pressed="${s.absent}"><span>${esc(s.name)}<small>${esc(s.matricule||'')}</small></span><i>${s.absent?t('rl_ab'):t('rl_pr')}</i></button>`).join('')}</div>
 ${m?`<p class=ck-err role=alert>${m}</p>`:''}<button class=ck-btn id=rs onclick="rollSave()">${ic('check',24)}<span>${t('rl_save')}</span></button><button class="ck-btn alt" onclick="draw()">${t('rl_back')}</button></div></main>`}
function rollTog(i){RS.students[i].absent=!RS.students[i].absent;const y=scrollY;rollDraw();scrollTo(0,y)}
async function rollSave(){const b=$('#rs');b.disabled=true;const r=await post('roll/save',{class_id:I.cid,date:I.rdate,period:I.period,absent:RS.students.filter(s=>s.absent).map(s=>s.id)});if(!r.ok)return rollDraw(t('rl_err'));I.rolled=true;I.rollMsg=t('rl_saved')+' '+t('rl_n',{n:r.d.absent});draw()}

function view(o,m){const per=o.period?`${t('period')} ${o.period} · ${o.start}–${o.end}`:'';
 switch(o.state){
 case'login':return{i:'qr',tone:'',title:t('signin'),p:t('signin_d'),form:1};

 case'done':{const late=o.status=='late',rep=o.status=='replaced',wait=rep&&o.appr==null;return{i:wait?'clock':'check',tone:wait||late?'warn':'ok',title:late?t('late'):rep?t('replaced'):t('done'),p:wait?t('replaced_d'):t('confirmed_at',{t:(o.at||'').slice(11,16)})}}

 $('#m').innerHTML=`<div class=ck-top><div class=ck-logo><i aria-hidden=true></i>${t('brand')}</div>${lang()}</div>

 ${v.retry?`<button class="ck-btn alt" onclick="load()">${t('retry')}</button>`:''}${o.state=='done'&&o.roll=='lesson'&&o.period?`${o.rollMsg?`<p class=ck-hint style="text-transform:none;letter-spacing:0;font-family:inherit">${esc(o.rollMsg)}</p>`:''}<button class=ck-btn onclick="rollOpen()">${ic('user',24)}<span>${o.rolled?t('rl_edit'):t('rl_btn')}</span></button>`:''}</div></main>
