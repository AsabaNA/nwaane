<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex"><title>Referral programme</title><link rel=stylesheet href=style.css><link rel=stylesheet href=signup.css>
<style>.sw-app{max-width:760px}.rf-s{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.rf-s div{background:var(--sl);border-radius:16px;padding:16px}.rf-s p{font-size:12px;color:var(--onv)}.rf-s b{font:700 22px Sora,sans-serif;display:block}
.rf-link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pc);color:var(--opc);border-radius:16px;padding:14px 16px;margin:14px 0}.rf-link code{font:600 15px Manrope,monospace;word-break:break-all;flex:1;min-width:180px}
.rf-t{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.rf-t th{text-align:left;font-size:12px;color:var(--onv);font-weight:600;padding:6px 8px 6px 0;background:none;border:0;text-transform:none;letter-spacing:0}.rf-t td{background:none}.rf-t tr:nth-child(even) td{background:none}.rf-t td{padding:9px 8px 9px 0;border-top:1px solid var(--olv)}.rf-t .n{text-align:right;white-space:nowrap}
.rf-tabs{display:flex;gap:6px;margin-bottom:20px}.rf-tabs button{flex:1}
.rf-c{display:inline-block;font:700 12px Manrope,sans-serif;padding:2px 10px;border-radius:999px;background:var(--sh);color:var(--onv)}.rf-c.free{background:var(--sc);color:var(--osc)}.rf-c.paying{background:var(--okc);color:var(--ok)}
@media(max-width:600px){.rf-s{grid-template-columns:1fr}}</style></head><body style="margin:0"><div id=app class=sw></div>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L=localStorage.lang||((navigator.language||'').startsWith('fr')?'fr':'en'),MODE='in',TK=null,HINT='',ME=null;
const D={en:{t:'Referral programme',intro:'Recommend School Platform to schools. Every school that signs up with your code gets 10% off for its first year, and you earn 10% of everything it pays during that year.',in:'Sign in',up:'Create referral account',name:'Full name',email:'Email',phone:'Phone (for payouts)',pw:'Password',go:'Continue',code_h:'Check your email',code_p:'We sent a 6-digit code to',code:'6-digit code',verify:'Verify',again:'Send again',sent:'A new code is on its way.',
 e_login:'Wrong email or password.',e_email:'Enter a valid email address.',e_pw:'The password needs at least 8 characters.',e_required:'Please enter your name.',e_taken:'This email already has a referral account. Sign in instead.',e_many:'Too many attempts. Try again later.',e_code:'That code is wrong or expired.',e_expired:'This expired. Please start again.',e_wait:'Wait 30 seconds before asking again.',e_mail:'We could not send the email. Try again.',
 hi:'Hello',out:'Sign out',yours:'Your referral code',link:'Your sign-up link',copy:'Copy',copied:'Copied',earned:'Earned',paid:'Paid out',payable:'Payable now',sch:'Schools you referred',none:'No school has signed up with your code yet. Share your link.',school:'School',since:'Signed up',state:'Status',s_free:'Free term',s_paying:'In referral year',s_ended:'Year ended',payouts:'Payouts',nopay:'No payouts yet.',date:'Date',how:'Payouts are made by mobile money or bank transfer. Commission is earned on each payment a school makes during its first year, and shows here once the payment is recorded.',back:'Back'},
 fr:{t:'Programme de parrainage',intro:'Recommandez School Platform aux écoles. Chaque école qui s’inscrit avec votre code obtient 10 % de remise la première année, et vous gagnez 10 % de tout ce qu’elle paie pendant cette année.',in:'Se connecter',up:'Créer un compte parrain',name:'Nom complet',email:'E-mail',phone:'Téléphone (pour les versements)',pw:'Mot de passe',go:'Continuer',code_h:'Consultez votre e-mail',code_p:'Nous avons envoyé un code à 6 chiffres à',code:'Code à 6 chiffres',verify:'Vérifier',again:'Renvoyer',sent:'Un nouveau code est en route.',
 e_login:'E-mail ou mot de passe incorrect.',e_email:'Saisissez une adresse e-mail valide.',e_pw:'Le mot de passe doit contenir au moins 8 caractères.',e_required:'Saisissez votre nom.',e_taken:'Cet e-mail a déjà un compte parrain. Connectez-vous.',e_many:'Trop de tentatives. Réessayez plus tard.',e_code:'Ce code est incorrect ou expiré.',e_expired:'Session expirée. Recommencez.',e_wait:'Attendez 30 secondes avant de redemander.',e_mail:'Impossible d’envoyer l’e-mail. Réessayez.',
 hi:'Bonjour',out:'Se déconnecter',yours:'Votre code de parrainage',link:'Votre lien d’inscription',copy:'Copier',copied:'Copié',earned:'Gagné',paid:'Versé',payable:'À verser',sch:'Écoles parrainées',none:'Aucune école ne s’est encore inscrite avec votre code. Partagez votre lien.',school:'École',since:'Inscrite le',state:'Statut',s_free:'Trimestre gratuit',s_paying:'Année de parrainage',s_ended:'Année terminée',payouts:'Versements',nopay:'Aucun versement.',date:'Date',how:'Les versements se font par mobile money ou virement. La commission est gagnée sur chaque paiement d’une école pendant sa première année et apparaît ici une fois le paiement enregistré.',back:'Retour'}};
const t=k=>D[L][k]||k,fm=n=>Math.round(n||0).toLocaleString('fr-FR').replace(/[  ]/g,' ')+' FCFA';
const api=async(u,o)=>{const r=await fetch('/api/ref/'+u,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});let d={};try{d=await r.json()}catch{}return{ok:r.ok,s:r.status,d}};
const er=r=>t('e_'+(r.d.error||'x')) .startsWith('e_')?t('e_many'):t('e_'+r.d.error);
const lang=()=>`<div class=sw-lang>${['en','fr'].map(l=>`<button type=button class="${L==l?'on':''}" onclick="L='${l}';localStorage.lang=L;document.documentElement.lang=L;draw()">${l.toUpperCase()}</button>`).join('')}</div>`;
const fld=(id,label,type,ac)=>`<div class="sw-f" style="margin-bottom:22px"><input class=i id=${id} type=${type} placeholder=" " autocomplete=${ac} style="padding-left:16px"><label for=${id} style="left:10px">${label}</label></div>`;
const shell=h=>$('#app').innerHTML=`${lang()}<div class=sw-app><div class=sw-brand><div class=sw-logo><svg class="ic f" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5-9-5Z"/></svg></div><h1>${t('t')}</h1></div><main class=sw-card>${h}</main></div>`;
function draw(){ME?dash():TK?codeView():authView()}
function authView(m=''){shell(`<p class=lead>${t('intro')}</p><div class=rf-tabs><button class="sw-btn ${MODE=='in'?'fill':'tonal'}" onclick="MODE='in';authView()">${t('in')}</button><button class="sw-btn ${MODE=='up'?'fill':'tonal'}" onclick="MODE='up';authView()">${t('up')}</button></div>
 <form onsubmit="return sub(event)" novalidate>${MODE=='up'?fld('nm',t('name'),'text','name')+fld('ph',t('phone'),'tel','tel'):''}${fld('em',t('email'),'email','email')}${fld('pw',t('pw'),'password',MODE=='up'?'new-password':'current-password')}<div class=sw-err id=e role=alert>${esc(m)}</div><div class=sw-act style="margin-top:12px"><span></span><button class="sw-btn fill" id=b type=submit>${t('go')}</button></div></form>`)}
async function sub(e){e.preventDefault();$('#b').disabled=true;const em=$('#em').value,pw=$('#pw').value;let r;
 if(MODE=='up')r=await api('signup',{name:$('#nm').value,phone:$('#ph').value,email:em,password:pw,lang:L});else r=await api('login',{email:em,password:pw,lang:L});
 if(!r.ok){$('#b').disabled=false;$('#e').textContent=er(r);return false}
 if(r.d.ticket){TK=r.d.ticket;HINT=r.d.hint;return codeView(),false}load();return false}
function codeView(m='',good){shell(`<h2>${t('code_h')}</h2><p class=lead>${t('code_p')} <b>${esc(HINT)}</b></p><form onsubmit="return vf(event)" novalidate>${fld('cd',t('code'),'text','one-time-code')}<div class=sw-err id=e role=alert style="${good?'color:var(--ok)':''}">${esc(m)}</div><div class=sw-act style="margin-top:12px"><a href=# onclick="again();return false">${t('again')}</a><button class="sw-btn fill" id=b type=submit>${t('verify')}</button></div></form>`);const c=$('#cd');c.setAttribute('inputmode','numeric');c.maxLength=6;c.focus()}
async function vf(e){e.preventDefault();const r=await api('verify',{ticket:TK,code:$('#cd').value});if(!r.ok){if(r.s==410){TK=null;return authView(t('e_expired')),false}$('#e').textContent=er(r);return false}TK=null;load();return false}
async function again(){const r=await api('resend',{ticket:TK,lang:L});if(r.s==410){TK=null;return authView(t('e_expired'))}codeView(r.ok?t('sent'):er(r),r.ok)}
async function load(){const r=await api('me');if(!r.ok){ME=null;return authView()}ME=r.d;dash()}
function dash(){const d=ME,link=location.origin+'/?ref='+d.code;
 shell(`<h2>${t('hi')}, ${esc(d.name)}</h2><p class=lead>${t('intro')}</p>
 <div class=rf-link><span style="font-size:13px;font-weight:700">${t('yours')}</span><code style="font-size:22px;letter-spacing:2px;flex:none">${esc(d.code)}</code></div>
 <div class=rf-link><span style="font-size:13px;font-weight:700">${t('link')}</span><code>${esc(link)}</code><button class="sw-btn tonal" id=cp style="height:40px;padding:0 16px" onclick="cp()">${t('copy')}</button></div>
 <div class=rf-s><div><p>${t('earned')}</p><b>${fm(d.earned)}</b></div><div><p>${t('paid')}</p><b>${fm(d.paid)}</b></div><div><p>${t('payable')}</p><b style="color:var(--ok)">${fm(d.payable)}</b></div></div>
 <h3 style="font:700 16px Sora,sans-serif;margin:24px 0 4px">${t('sch')}</h3>${d.schools.length?`<table class=rf-t><tr><th>${t('school')}<th>${t('since')}<th>${t('state')}<th class=n>${t('earned')}</tr>${d.schools.map(s=>`<tr><td>${esc(s.name)}<td>${esc(s.since)}<td><span class="rf-c ${s.state}">${t('s_'+s.state)}</span><td class=n>${fm(s.earned)}`).join('')}</table>`:`<p class=m>${t('none')}</p>`}
 <h3 style="font:700 16px Sora,sans-serif;margin:24px 0 4px">${t('payouts')}</h3>${d.payouts.length?`<table class=rf-t><tr><th>${t('date')}<th>Ref<th class=n>FCFA</tr>${d.payouts.map(p=>`<tr><td>${esc(p.created)}<td>${esc((p.method||'').toUpperCase())} ${esc(p.ref||'')}<td class=n>${fm(p.amount)}`).join('')}</table>`:`<p class=m>${t('nopay')}</p>`}
 <p class=m style="margin-top:20px">${t('how')}</p><div class=sw-act><span></span><button class="sw-btn text" onclick="lo()">${t('out')}</button></div>`)}
async function cp(){try{await navigator.clipboard.writeText(location.origin+'/?ref='+ME.code)}catch{}$('#cp').textContent=t('copied');setTimeout(()=>{if($('#cp'))$('#cp').textContent=t('copy')},1800)}
async function lo(){await api('logout',{});ME=null;MODE='in';authView()}
document.documentElement.lang=L;load();
</script></body></html>
